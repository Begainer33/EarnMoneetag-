<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Watch Ad</title>

<style>
body{
background:#111;
margin:0;
padding:20px;
color:white;
font-family:Arial;
text-align:center;
}

#player{
width:100%;
max-width:400px;
margin:auto;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/video.js/dist/video.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/video.js/dist/video-js.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/videojs-contrib-ads/dist/videojs.ads.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/videojs-ima/dist/videojs.ima.min.js"></script>
</head>

<body>

<h2>🎬 Watch Video Ad</h2>

<video
id="player"
class="video-js"
controls
playsinline
width="400"
height="250"
>
</video>

<script>

var player=videojs('player');

player.ima({
adTagUrl:'https://www.videosprofitnetwork.com/watch.xml?key=55c05a8421f6ff355933fc9da838f0c8'
});

player.ready(function(){

player.ima.initializeAdDisplayContainer();

player.ima.requestAds();

});

</script>

</body>
</html>
